<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIUI</title>
<style>
, ::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html {
background: #111;
}
body {
background: #111;
color: #f0f0f0;
font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
font-size: 16px;
line-height: 1.6;
text-align: center;
padding: 3rem 1rem 2rem;
}
.wrap {
max-width: 640px;
margin: 0 auto;
}
h1 {
font-size: 3rem;
letter-spacing: 0.15em;
color: #a3f7ff;
margin-bottom: 0.5rem;
}
.tagline {
font-size: 1.15rem;
color: #d0d0d0;
margin-bottom: 1.5rem;
}
p {
color: #c0c0c0;
max-width: 480px;
margin: 0 auto 2rem;
}
footer {
margin-top: 3rem;
font-size: 0.9rem;
color: #888;
}
footer a {
color: #a3f7ff;
text-decoration: none;
}
</style>
</head>
<body>
<div class="wrap">
<h1>FIUI</h1>
<p class="tagline">We build open technology for the physical world.</p>
<p>
FIUI is a small team building practical tools at the intersection
of hardware and software. We believe open technology is the right
foundation for the physical world — tools anyone can inspect,
improve, and build on.
</p>
<footer>
<a href="mailto:hello@fiui.org">hello@fiui.org</a>
</footer>
</div>
</body>
</html>
